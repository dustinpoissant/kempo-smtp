<content id="kempo-smtp-settings-tab" name="SMTP settings tab" owner="kempo-smtp" enabled="true" locked="true" location="admin-settings-tabs" priority="20"><k-settings-tab name="smtp" label="SMTP" position="410"><p class="tc-muted mb">Sends the site's email through an SMTP server, such as the mailbox that comes with your domain. The address emails are sent from is the Email from setting on the System tab, and it must be that mailbox's address (or one of its aliases). After saving, send a test email from <a href="/admin/emails">Emails</a>.</p><k-settings-panel owner="kempo-smtp"></k-settings-panel></k-settings-tab></content>
